{# Recebe: category. #}
<li class="flex items-center justify-between gap-3 bg-slate-900/50 hover:bg-slate-800/60 transition px-4 py-3">
    <div class="flex min-w-0 flex-1 items-center gap-3">
        <span class="size-3 shrink-0 rounded-full" style="background-color: {{ category.color }}" aria-hidden="true"></span>
        <span class="min-w-0 truncate text-sm font-semibold text-slate-100" title="{{ category.name }}">{{ category.name }}</span>
    </div>
    <div class="flex shrink-0 items-center gap-3">
        {% if category.category_type == 'income' %}
            <span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-400">{{ category.get_category_type_display }}</span>
        {% else %}
            <span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-500/15 text-rose-400">{{ category.get_category_type_display }}</span>
        {% endif %}
        <div class="flex items-center gap-1">
            <a href="{% url 'categories:update' category.pk %}" aria-label="Editar categoria {{ category.name }}" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 focus:ring-offset-slate-950">
                <svg class="size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/>
                </svg>
            </a>
            <a href="{% url 'categories:delete' category.pk %}" aria-label="Excluir categoria {{ category.name }}" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 focus:ring-offset-slate-950">
                <svg class="size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
                </svg>
            </a>
        </div>
    </div>
</li>
