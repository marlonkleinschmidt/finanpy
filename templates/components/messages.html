{% if messages %}
    <div class="space-y-3">
        {% for message in messages %}
            {% if 'error' in message.tags %}
                <div role="alert" class="rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 px-4 py-3 text-sm">{{ message }}</div>
            {% elif 'warning' in message.tags %}
                <div role="alert" class="rounded-xl border border-amber-500/30 bg-amber-500/10 text-amber-300 px-4 py-3 text-sm">{{ message }}</div>
            {% elif 'success' in message.tags %}
                <div role="status" class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 px-4 py-3 text-sm">{{ message }}</div>
            {% else %}
                <div role="status" class="rounded-xl border border-slate-700 bg-slate-800 text-slate-300 px-4 py-3 text-sm">{{ message }}</div>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}
