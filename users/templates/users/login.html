<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Finanpy</title>
</head>
<body>
    <h1>Entrar</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
