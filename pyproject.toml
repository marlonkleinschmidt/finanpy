[tool.ruff]
line-length = 79
extend-exclude = ['*/migrations/*']

[tool.ruff.lint]
select = ['E', 'W', 'F', 'Q']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.format]
quote-style = 'single'

[tool.coverage.run]
source = ['.']
omit = ['venv/*', '*/migrations/*', '*/tests.py', 'manage.py']

[tool.coverage.report]
fail_under = 80
show_missing = true
